# Replaces the broken GitHub → Vercel git integration: every push to main is
# released to production, so a content fix no longer waits for someone to
# remember `vercel deploy --prod --yes`.
name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://careers.alter-5.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Not secrets: these two only identify the project, they grant nothing.
          VERCEL_ORG_ID: team_aNqzOxrvzWGAF6nvSnl1Z0zf
          VERCEL_PROJECT_ID: prj_Rk7C6AjqDNk4HiIUP0FWh4QC0ZTK
